name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required repository files
        shell: bash
        run: |
          set -euo pipefail
          required=(README.md LICENSE SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md SUPPORT.md .gitignore)
          for path in "${required[@]}"; do
            test -s "$path" || {
              printf 'Required file is missing or empty: %s\n' "$path" >&2
              exit 1
            }
          done

      - name: Validate POSIX shell syntax
        shell: bash
        run: |
          set -euo pipefail
          found=false
          while IFS= read -r -d '' script; do
            found=true
            printf 'Checking %s\n' "$script"
            sh -n "$script"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if [[ "$found" == false ]]; then
            echo 'No shell scripts are committed yet; syntax check skipped.'
          fi

      - name: Reject tracked private runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"
          forbidden='(^|/)(service-env|memory|reports|backups|runtime|state)/|(^|/)(unifi-clients\.json|pihole-metrics\.csv|pihole-domain-review\.md|pihole-monitor-report\.md)$|(^|/).*\.(key|pem|secret)$'
          if printf '%s\n' "$tracked" | grep -E "$forbidden"; then
            echo 'Private runtime or credential-like artifacts must not be committed.' >&2
            exit 1
          fi
